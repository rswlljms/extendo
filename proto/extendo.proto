syntax = "proto3";

package extendo.v1;

// Single contract for host <-> Android / Web clients.
// RULE: never reuse or renumber fields. Only add new fields with new numbers.

message TransportInfo {
  string kind = 1;      // "wifi" | "rndis" | "localhost"
  string addr = 2;      // e.g. "192.168.1.10" or "127.0.0.1"
  int32 port = 3;       // control/video port, default 9577
  int32 rtt_ms = 4;     // last measured RTT, -1 if unknown
}

message VideoConfig {
  int32 width = 1;        // e.g. 1280
  int32 height = 2;       // e.g. 720
  int32 fps = 3;          // 30 or 60
  int32 bitrate_kbps = 4; // 2000-12000
  string codec = 5;       // "h264" only in v1
}

message PairRequest {
  string device_name = 1;
  string token = 2;       // QR token / PIN
}

message PairResponse {
  bool accepted = 1;
  string reason = 2;
  TransportInfo transport = 3;
  VideoConfig video = 4;
}

message InputEvent {
  string type = 1;    // "touch" | "mouse_move" | "mouse_down" | "mouse_up" | "key" | "scroll"
  float x = 2;        // normalized 0..1 (absolute mode)
  float y = 3;
  int32 key_code = 4; // virtual-key code for key events
  bool down = 5;
  int32 dx = 6;       // relative deltas
  int32 dy = 7;
}

message Stats {
  int32 rtt_ms = 1;
  int32 fps = 2;
  int32 drops = 3;
  int32 bitrate_kbps = 4;
}

message Heartbeat {
  int64 client_ts_ms = 1;
  int64 server_ts_ms = 2;
}

// Phase 1: true-extend display control (host <-> VDD helper, mirrored on HTTP).
// RULE: never reuse or renumber fields. Only add new fields with new numbers.

message DisplayMode {
  int32 width = 1;
  int32 height = 2;
  int32 fps = 3;
}

message Monitor {
  int32 id = 1;
  int32 width = 2;
  int32 height = 3;
  int32 fps = 4;
  bool active = 5;
  string edid = 6; // EDID profile name, e.g. "phone-1080p"
}

message DisplayAdd {
  DisplayMode mode = 1;
  string edid = 2;
}

message DisplayRemove {
  int32 id = 1;
}

message CaptureSource {
  string backend = 1; // "test" | "wgc" | "dxgi" (Rust core; Node runs "test")
  int32 monitor_id = 2; // virtual monitor only; -1 = main display (mirror fallback)
}
